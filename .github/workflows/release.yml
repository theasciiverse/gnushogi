# Asciiverse release workflow (tags *-av.*, or run by hand with a tag)
# Builds GNU Shogi for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, gnushogi-<target>.tar.gz, holding the
# program with its opening book (gnushogi.tbk) beside it, plus SHA256SUMS,
# attached to a GitHub release (hub/catalog/SCHEMA.md, release.source =
# "github"). For everyone else: .deb, .rpm, .apk and Arch packages of the
# static Linux binary, made by nfpm (asciiverse/nfpm.yaml), with the book
# in /usr/share/gnushogi, the folder compiled in.
#
# Tags look like v1.4.2+20141119-av.1: upstream's last release, the date
# of the upstream commit built, then our packaging release. Linux builds
# run in Alpine and link ncurses statically (its tinfo stands in for the
# termcap library configure asks for); macOS links the system ncurses.
# No Windows: the curses display uses POSIX signals.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: gnushogi
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package for av
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base autoconf automake ncurses-dev ncurses-static &&
            ln -sf /usr/lib/libtinfo.a /usr/lib/libtermcap.a &&
            LDFLAGS="-static -s" asciiverse/package.sh ${{ matrix.target }} &&
            chown -R '"$(id -u):$(id -g)"' /src'
          file out/gnushogi/gnushogi

      - name: System packages
        run: |
          v="${TAG#v}"; v="${v%%-av.*}"; export VERSION="${v%%+*}" RELEASE="${TAG##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          brew list autoconf >/dev/null 2>&1 || brew install autoconf
          brew list automake >/dev/null 2>&1 || brew install automake
          CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" \
            asciiverse/package.sh ${{ matrix.target }}
          file out/gnushogi/gnushogi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    # macOS is released when it builds; Linux must
    needs: [linux, macos]
    if: ${{ always() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "GNU Shogi $TAG" \
                 --notes "GNU Shogi from git.savannah.gnu.org/git/gnushogi.git, shogi against the computer with a curses display, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
